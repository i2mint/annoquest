[project]
name = "annoquest-server"
version = "0.1.0"
description = "The server adapter for annoquest guided annotation requests: serves the viewer, keeps requests write-once and responses append-only, and stamps identity from a forward-auth header."
readme = "annoquest_server/README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
server = ["starlette>=0.40", "uvicorn>=0.30"]
test = ["starlette>=0.40", "httpx>=0.27", "pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["annoquest_server"]

[tool.pytest.ini_options]
testpaths = ["tests_py"]
